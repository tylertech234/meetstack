# Custom Nginx configuration snippets
#
# This file is bind-mounted read-only into the Nginx Proxy Manager container
# at /etc/nginx/conf.d/custom.conf and is loaded for every server block.
#
# Use it for global tweaks such as:
#   - Increasing client_max_body_size for large file uploads
#   - Adding custom security headers
#   - Defining upstream keepalive tuning

# Increase max upload size (useful for n8n file nodes and Vikunja attachments)
client_max_body_size 100m;

# Security headers applied globally
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
