networks:
  meetstack:
    driver: bridge

volumes:
  n8n_data:
  ollama_data:
  open_webui_data:
  vikunja_db_data:
  vikunja_files_data:
  wikijs_db_data:
  wikijs_data:
  radicale_data:
  whisper_cache:
  nginx_data:
  nginx_letsencrypt:

services:
  # ─── n8n ────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.13.3
    container_name: n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      - TZ=${TZ}
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./services/n8n:/home/node/.n8n/custom
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - meetstack

  # ─── Ollama ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.18.3
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      - TZ=${TZ}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    volumes:
      - ollama_data:/root/.ollama
      - ./services/ollama:/etc/ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Uncomment the following section to enable GPU passthrough (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - meetstack

  # ─── Open WebUI ─────────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.8.12
    container_name: open-webui
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open_webui_data:/app/backend/data
      - ./services/open-webui:/app/backend/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - meetstack

  # ─── Vikunja (database) ─────────────────────────────────────────────────────
  vikunja-db:
    image: mariadb:11.4
    container_name: vikunja-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${VIKUNJA_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${VIKUNJA_DB_NAME}
      - MYSQL_USER=${VIKUNJA_DB_USER}
      - MYSQL_PASSWORD=${VIKUNJA_DB_PASSWORD}
    volumes:
      - vikunja_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - meetstack

  # ─── Vikunja ────────────────────────────────────────────────────────────────
  vikunja:
    image: vikunja/vikunja:2.2.2
    container_name: vikunja
    restart: unless-stopped
    expose:
      - "3456"
    environment:
      - TZ=${TZ}
      - VIKUNJA_DATABASE_HOST=vikunja-db
      - VIKUNJA_DATABASE_TYPE=mysql
      - VIKUNJA_DATABASE_DATABASE=${VIKUNJA_DB_NAME}
      - VIKUNJA_DATABASE_USER=${VIKUNJA_DB_USER}
      - VIKUNJA_DATABASE_PASSWORD=${VIKUNJA_DB_PASSWORD}
      - VIKUNJA_SERVICE_JWTSECRET=${VIKUNJA_JWT_SECRET}
      - VIKUNJA_SERVICE_FRONTENDURL=${VIKUNJA_FRONTEND_URL}
    volumes:
      - vikunja_files_data:/app/vikunja/files
      - ./services/vikunja:/app/vikunja/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      vikunja-db:
        condition: service_healthy
    networks:
      - meetstack

  # ─── Wiki.js (database) ────────────────────────────────────────────────────
  wikijs-db:
    image: postgres:17-alpine
    container_name: wikijs-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${WIKIJS_DB_NAME}
      - POSTGRES_USER=${WIKIJS_DB_USER}
      - POSTGRES_PASSWORD=${WIKIJS_DB_PASSWORD}
    volumes:
      - wikijs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WIKIJS_DB_USER} -d ${WIKIJS_DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - meetstack

  # ─── Wiki.js ────────────────────────────────────────────────────────────────
  wikijs:
    image: ghcr.io/requarks/wiki:2
    container_name: wikijs
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - TZ=${TZ}
      - DB_TYPE=postgres
      - DB_HOST=wikijs-db
      - DB_PORT=5432
      - DB_NAME=${WIKIJS_DB_NAME}
      - DB_USER=${WIKIJS_DB_USER}
      - DB_PASS=${WIKIJS_DB_PASSWORD}
    volumes:
      - wikijs_data:/wiki/data
      - ./services/wikijs:/wiki/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      wikijs-db:
        condition: service_healthy
    networks:
      - meetstack

  # ─── Radicale (CalDAV calendar) ────────────────────────────────────────────
  radicale:
    image: tomsquest/docker-radicale:3.6.1.0
    container_name: radicale
    restart: unless-stopped
    expose:
      - "5232"
    environment:
      - TZ=${TZ}
      - RADICALE_CONFIG_SERVER_HOSTS=0.0.0.0:5232
      - RADICALE_CONFIG_AUTH_TYPE=none
      - RADICALE_CONFIG_AUTH_HTPASSWD_FILENAME=/data/users
      - RADICALE_CONFIG_AUTH_HTPASSWD_ENCRYPTION=bcrypt
      - RADICALE_CONFIG_STORAGE_FILESYSTEM_FOLDER=/data/collections
      - RADICALE_CONFIG_LOGGING_LEVEL=warning
    volumes:
      - radicale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5232/.web/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - meetstack

  # ─── Whisper (speech-to-text) ───────────────────────────────────────────────
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - TZ=${TZ}
      - ASR_MODEL=${WHISPER_MODEL:-tiny}
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper_cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - meetstack

  # ─── Nginx Proxy Manager ────────────────────────────────────────────────────
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.14.0
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    environment:
      - TZ=${TZ}
    volumes:
      - nginx_data:/data
      - nginx_letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:81/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      n8n:
        condition: service_healthy
      open-webui:
        condition: service_healthy
      vikunja:
        condition: service_healthy
      wikijs:
        condition: service_healthy
      radicale:
        condition: service_healthy
    networks:
      - meetstack
